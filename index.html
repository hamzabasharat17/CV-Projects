<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Projects Portfolio</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="container">
            <div class="header-content">
                <h1>Saira Gillani Projects Portfolio</h1>
                <p>Showcasing Innovation in AI, Robotics & Computer Vision</p>
                
                <!-- Stats Section -->
                <div class="header-stats">
                    <div class="stat-item">
                        <span class="stat-number" id="projectsCount">0</span>
                        <span class="stat-label">Projects</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-number" id="completedCount">0</span>
                        <span class="stat-label">Completed</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-number" id="technologiesCount">0</span>
                        <span class="stat-label">Technologies</span>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="container">
        <!-- Search and Filter -->
        <div class="controls">
            <input type="text" id="search" placeholder="Search projects..." class="search-box">
            <select id="categoryFilter" class="filter-select">
                <option value="all">All Categories</option>
            </select>
            <select id="statusFilter" class="filter-select">
                <option value="all">All Status</option>
                <option value="Completed">Completed</option>
                <option value="In Progress">In Progress</option>
            </select>
        </div>

        <!-- Projects Grid -->
        <div id="projectsGrid" class="projects-grid">
            <!-- Projects will be loaded here by JavaScript -->
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2024 My Projects Portfolio. Built with passion and innovation.</p>
        </div>
    </footer>

    <script src="projects.js"></script>
    <script src="script.js"></script>
</body>
</html>
